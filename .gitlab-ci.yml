workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

default:
  image: python:3.11-slim

update:
  stage: build
  variables:
    GIT_STRATEGY: none
  script:
    - apt-get update >/dev/null && apt-get install -y --no-install-recommends git >/dev/null
    - git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/surfrpt1/surfrpt.git repo
    - cd repo
    - python tools/update.py
    - git config user.name "surfrpt1"
    - git config user.email "surfrpt1@users.noreply.github.com"
    - git add -A
    - |
      if ! git diff --cached --quiet; then
        git commit -m "chore: auto-update configs ($(date -u +%Y-%m-%d))"
        git push https://x-access-token:${GH_TOKEN}@github.com/surfrpt1/surfrpt.git HEAD:main
      else
        echo "No changes to commit"
      fi
